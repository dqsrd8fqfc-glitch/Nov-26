<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nov-26 Test Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      text-align: center;
    }
    .card {
      padding: 2rem 2.5rem;
      border-radius: 16px;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 0.5rem; }
    p { color: #94a3b8; margin: 0.25rem 0; }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✅ It works!</h1>
    <p>This is a test page for the Nov-26 repo.</p>
    <p id="time"></p>
    <button onclick="alert('Hello from Nov-26!')">Click me</button>
  </div>
  <script>
    document.getElementById('time').textContent = 'Loaded: ' + new Date().toLocaleString();
  </script>
</body>
</html>

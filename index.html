<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission Control">
<meta name="theme-color" content="#070b16">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mission Control</title>
<style>
  :root {
    --bg: #070b16; --bg2: #0c1324;
    --card: rgba(255,255,255,0.045); --card-hi: rgba(255,255,255,0.07); --line: rgba(255,255,255,0.08);
    --text: #eef2f8; --muted: #93a1b8; --faint: #5f6d85;
    --up: #34d399; --down: #f87171; --warn: #fbbf24;
    --radius: 22px; --gap: 14px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  iframe { color-scheme: normal; background: transparent !important; }
  html { background: #0a0f1d; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background:
      radial-gradient(1000px 500px at 0% -10%, rgba(99,102,241,0.20), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(20,184,166,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  /* faint grid, mission-control feel */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(180deg, #000, transparent 70%); -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%);
  }
  .wrap {
    max-width: 1400px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 14px)
             calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px);
  }

  /* ---------- Header ---------- */
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .clock { font-size: clamp(50px, 14vw, 84px); font-weight: 200; letter-spacing: -0.04em; line-height: .95; margin: 0; font-variant-numeric: tabular-nums; }
  .date { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .sweep { text-align: right; font: 500 12px/1.5 var(--mono); color: var(--muted); }
  .sweep b { color: var(--text); font-weight: 600; }

  /* ---------- Team roster ---------- */
  .roster { display: flex; gap: 10px; overflow-x: auto; margin: 18px -14px 16px; padding: 2px 14px 4px; scrollbar-width: none; }
  .roster::-webkit-scrollbar { display: none; }
  .member {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 62px;
    background: none; border: none; color: var(--muted); font: 500 11px/1.2 -apple-system, system-ui, sans-serif; cursor: pointer; padding: 0;
  }
  .member .av { width: 50px; height: 50px; font-size: 22px; }
  .member.new .av::after {
    content: attr(data-n); position: absolute; top: -3px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: #ef4444; color: #fff; font: 700 11px/18px -apple-system, system-ui, sans-serif; text-align: center;
  }

  /* Avatar */
  .av {
    position: relative; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--c) 55%, #fff 0%), color-mix(in srgb, var(--c) 35%, #000));
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 60%, transparent), 0 6px 18px color-mix(in srgb, var(--c) 30%, transparent);
  }
  .av .st { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--bg); background: var(--faint); }
  .av .st.on { background: var(--up); }
  .av .st.live { background: var(--up); animation: pulse 1.8s infinite; }
  .av .st.warn { background: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.7); } 70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }

  /* ---------- Grid ---------- */
  .grid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } .full { grid-column: 1 / -1; } }
  @media (min-width: 1080px) { .grid { grid-template-columns: repeat(3, 1fr); } .span2 { grid-column: span 2; } }

  /* ---------- Agent card ---------- */
  .agent {
    --c: #818cf8;
    position: relative; overflow: hidden; min-width: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
    backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
    animation: rise .55s ease both; scroll-margin-top: 16px;
  }
  .agent::before { /* accent glow strip */
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--c), transparent); opacity: .8;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .a-head { display: flex; align-items: center; gap: 12px; }
  .a-head .av { width: 44px; height: 44px; font-size: 21px; }
  .a-who { flex: 1; min-width: 0; }
  .a-name { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .a-name span { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 4px; }
  .a-status { font: 500 11.5px/1.4 var(--mono); color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: 0 0 auto; font: 700 11px/1 -apple-system, system-ui, sans-serif; padding: 5px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, transparent); color: color-mix(in srgb, var(--c) 80%, #fff); }
  .report {
    margin: 14px 0 0; font-size: 16px; line-height: 1.45; color: var(--text);
    padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--c) 70%, transparent);
  }
  .report .q { color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }

  /* Chief briefing */
  .chief { --c: #a5b4fc; background: linear-gradient(135deg, rgba(99,102,241,0.16), rgba(20,184,166,0.08)); border-color: rgba(165,180,252,0.18); }
  .chief .a-head .av { width: 52px; height: 52px; font-size: 25px; }
  .brief { list-style: none; margin: 14px 0 0; padding: 0; }
  .brief li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15.5px; line-height: 1.4; opacity: 0; animation: rise .4s ease forwards; }
  .brief li:first-child { border-top: none; }
  .brief .av { width: 24px; height: 24px; font-size: 12px; margin-top: 1px; box-shadow: none; }
  .typing::after { content: "▍"; color: var(--muted); animation: blink 1s steps(1) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Lists */
  .items { list-style: none; margin: 12px 0 0; padding: 0; }
  .items li { border-top: 1px solid var(--line); }
  .items a { display: block; padding: 11px 2px; color: var(--text); text-decoration: none; }
  .items a:active { opacity: .6; }
  .items .h { font-size: 15px; line-height: 1.35; }
  .items .m { font: 500 11.5px/1.4 var(--mono); color: var(--faint); margin-top: 4px; }
  .items .m b { color: color-mix(in srgb, var(--c) 75%, #fff); font-weight: 600; }
  .items li.fresh .h::before { content: "●"; color: var(--c); font-size: 9px; vertical-align: 2px; margin-right: 6px; }
  .more {
    margin-top: 8px; width: 100%; border: none; background: var(--card-hi); color: var(--muted); border-radius: 12px; padding: 10px;
    font: 600 13px -apple-system, system-ui, sans-serif; cursor: pointer;
  }

  /* Markets */
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 14px; }
  .quote { background: var(--card-hi); border-radius: 14px; padding: 10px 12px; }
  .quote .n { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
  .quote .p { font-size: 18px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .quote .d { font: 600 12px/1 var(--mono); margin-top: 4px; }
  .chart { height: 230px; margin: 12px -8px -8px; }

  /* Weather */
  .wx-hours { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; scrollbar-width: none; }
  .wx-hours::-webkit-scrollbar { display: none; }
  .wx-hour { flex: 0 0 auto; text-align: center; padding: 8px 10px; border-radius: 14px; background: var(--card-hi); min-width: 52px; font-size: 13px; }
  .wx-hour div:nth-child(2) { font-size: 19px; margin: 2px 0; }
  .wx-day { display: flex; justify-content: space-between; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 14.5px; }
  .wx-day:first-of-type { margin-top: 10px; }
  .wx-day span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .linkish { background: none; border: none; padding: 0; color: inherit; font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }

  /* Sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto;
    background: #111a2e; border: 1px solid var(--line); border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform: translateY(105%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s;
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); } .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--faint); margin: 4px auto 16px; }
  .sheet h3 { margin: 0 0 10px; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  input[type=text] { font: inherit; font-size: 16px; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; outline: none; }
  .btn { border: none; border-radius: 12px; padding: 11px 16px; font-size: 15px; font-weight: 600; background: #5eead4; color: #042f2a; cursor: pointer; }
  .btn.ghost { background: rgba(255,255,255,.08); color: var(--text); width: 100%; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  footer { text-align: center; color: var(--faint); font: 500 11px/1.6 var(--mono); margin-top: 22px; }
  footer a { color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Mission Control</p>
      <h1 class="clock" id="clock">--:--</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="sweep" id="sweep">Connecting…</div>
  </header>

  <nav class="roster" id="roster" aria-label="Your team"></nav>

  <main class="grid" id="grid"></main>

  <footer>
    Agents report from public sources · Markets: Yahoo Finance &amp; <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> ·
    Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · News: BBC, Google News, The Verge, 9to5Mac
  </footer>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Weather location">
  <div class="grabber"></div>
  <h3>Send Skye somewhere else</h3>
  <form class="row" id="cityForm" autocomplete="off">
    <input type="text" id="cityInput" placeholder="Town or city" maxlength="60" enterkeyhint="search">
    <button class="btn" type="submit">Set</button>
  </form>
  <button class="btn ghost" id="geoBtn" type="button">📍 Use my current location</button>
  <p class="hint" id="cityMsg">Saved only in this browser.</p>
</div>

<!-- Hidden template for the MSFT mini chart (moved into the Markets card) -->
<template id="chartTpl">
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
  </div>
</template>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'style' && typeof v === 'object') for (const [sk, sv] of Object.entries(v)) sk.startsWith('--') ? n.style.setProperty(sk, sv) : (n.style[sk] = sv);
      else if (k.startsWith('data-') || k === 'aria-label') n.setAttribute(k, v);
      else n[k] = v;
    }
    kids.forEach(k => k != null && n.append(k));
    return n;
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('mc.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('mc.' + k, JSON.stringify(v)); } catch {} }
  };

  // ---------- The team ----------
  const TEAM = {
    atlas: { name: 'Atlas', role: 'Chief of staff', emoji: '🧭', c: '#a5b4fc' },
    mara:  { name: 'Mara',  role: 'Markets',        emoji: '📈', c: '#34d399' },
    rex:   { name: 'Rex',   role: 'Microsoft watch', emoji: '🪟', c: '#38bdf8', feed: 'msft' },
    skye:  { name: 'Skye',  role: 'Weather',        emoji: '⛅', c: '#5eead4' },
    nova:  { name: 'Nova',  role: 'World news',     emoji: '🌍', c: '#60a5fa', feed: 'top' },
    penny: { name: 'Penny', role: 'Business',       emoji: '💼', c: '#fbbf24', feed: 'markets' },
    tess:  { name: 'Tess',  role: 'Tech',           emoji: '🛰️', c: '#c084fc', feed: 'tech' },
    pip:   { name: 'Pip',   role: 'iPhone scout',   emoji: '📱', c: '#f472b6', feed: 'apple' },
  };
  const ORDER = ['atlas', 'mara', 'skye', 'rex', 'nova', 'penny', 'tess', 'pip'];

  const avatar = (id, status) => el('div', { className: 'av', style: { '--c': TEAM[id].c } },
    [TEAM[id].emoji, status !== undefined ? el('span', { className: 'st ' + (status || '') }) : null]);

  // Remember when you last looked, so agents can flag what's new
  const lastVisit = store.get('lastVisit', null);
  const markVisit = () => store.set('lastVisit', new Date().toISOString());
  document.addEventListener('visibilitychange', () => { if (document.hidden) markVisit(); });
  window.addEventListener('pagehide', markVisit);
  setTimeout(markVisit, 20000);

  // ---------- Helpers ----------
  const ago = iso => {
    if (!iso) return '';
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  };
  const hhmm = d => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const pctTxt = p => (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p).toFixed(2) + '%';
  const dirCls = p => p > 0 ? 'up' : p < 0 ? 'down' : '';
  const fmtPrice = (k, v) => k === 'GBPUSD' ? v.toFixed(4) : k === 'MSFT' ? '$' + v.toFixed(2) : v.toLocaleString('en-GB', { maximumFractionDigits: 0 });
  const isFresh = it => lastVisit && it.date && it.date > lastVisit;

  // US market clock (NASDAQ 09:30–16:00 New York; holidays not included)
  const nyParts = t => {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' })
      .formatToParts(t).map(x => [x.type, x.value]));
    return { day: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday), mins: +p.hour * 60 + +p.minute };
  };
  function market(now = new Date()) {
    const { day, mins } = nyParts(now), wk = day >= 1 && day <= 5;
    const open = wk && mins >= 570 && mins < 960;
    let next = '';
    if (!open) {
      const start = Math.ceil(now.getTime() / 60e3) * 60e3;
      for (let m = 0; m < 8 * 1440; m++) {
        const t = new Date(start + m * 60e3), p = nyParts(t);
        if (p.day >= 1 && p.day <= 5 && p.mins === 570) {
          next = (t.toDateString() === now.toDateString() ? '' : t.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ') + hhmm(t);
          break;
        }
        if (Math.abs(p.mins - 570) > 30) m += 29;
      }
    }
    return { open, next, pre: wk && mins >= 240 && mins < 570, post: wk && mins >= 960 && mins < 1200 };
  }

  // ---------- Data ----------
  let data = { feeds: [], quotes: {}, updated: null };
  let wx = null;
  let loc = store.get('loc', { lat: 51.51, lon: -0.13, name: 'London' });
  const feed = id => (data.feeds.find(f => f.id === id) || { items: [] }).items;

  const WX = {0:['☀️','clear'],1:['🌤️','mostly clear'],2:['⛅','partly cloudy'],3:['☁️','overcast'],45:['🌫️','foggy'],48:['🌫️','foggy'],
    51:['🌦️','light drizzle'],53:['🌦️','drizzle'],55:['🌧️','heavy drizzle'],56:['🌧️','freezing drizzle'],57:['🌧️','freezing drizzle'],
    61:['🌦️','light rain'],63:['🌧️','rain'],65:['🌧️','heavy rain'],66:['🌧️','freezing rain'],67:['🌧️','freezing rain'],
    71:['🌨️','light snow'],73:['🌨️','snow'],75:['❄️','heavy snow'],77:['🌨️','snow grains'],80:['🌦️','showers'],81:['🌧️','showers'],
    82:['⛈️','heavy showers'],85:['🌨️','snow showers'],86:['🌨️','snow showers'],95:['⛈️','thunderstorms'],96:['⛈️','thunderstorms'],99:['⛈️','thunderstorms']};
  const W = c => WX[c] || ['🌡️', 'unsettled'];
  const wet = c => c >= 51;

  // ---------- Reports (rule-based, written from the data) ----------
  function marketReport() {
    const q = data.quotes || {}, m = market(), msft = q.MSFT;
    if (!msft || msft.pct == null) return { text: [m.open ? 'Market’s open — I’m watching MSFT live on the chart below.' : 'Market’s closed. Live chart below while I wait for my quote feed.'], status: m.open ? 'live' : '' };
    const asOf = msft.time ? new Date(msft.time) : null;
    const dayName = asOf ? asOf.toLocaleDateString('en-GB', { weekday: 'long' }) : '';
    const mv = msft.pct >= 0 ? 'up' : 'down';
    const t = [];
    if (m.open) {
      t.push('MSFT is trading at ', el('b', { textContent: fmtPrice('MSFT', msft.price) }), ', ',
        el('span', { className: dirCls(msft.pct), textContent: `${mv} ${Math.abs(msft.pct).toFixed(1)}%` }), ' today');
      if (asOf) t.push(el('span', { className: 'q', textContent: ` (as of ${hhmm(asOf)})` }));
      t.push('.');
    } else {
      t.push(`Markets are closed. MSFT finished ${dayName ? dayName + ' ' : ''}at `, el('b', { textContent: fmtPrice('MSFT', msft.price) }), ', ',
        el('span', { className: dirCls(msft.pct), textContent: `${mv} ${Math.abs(msft.pct).toFixed(1)}%` }), '.');
      if (m.next) t.push(el('span', { className: 'q', textContent: ` Next open ${m.next}.` }));
    }
    const spx = q.SPX, ftse = q.FTSE;
    if (spx && spx.pct != null) t.push(` S&P 500 `, el('span', { className: dirCls(spx.pct), textContent: (spx.pct >= 0 ? '+' : '') + spx.pct.toFixed(1) + '%' }));
    if (ftse && ftse.pct != null) t.push(`, FTSE `, el('span', { className: dirCls(ftse.pct), textContent: (ftse.pct >= 0 ? '+' : '') + ftse.pct.toFixed(1) + '%' }));
    if ((spx && spx.pct != null) || (ftse && ftse.pct != null)) t.push('.');
    return { text: t, status: m.open ? 'live' : '', short: `MSFT ${m.open ? 'is' : 'closed'} ${mv} ${Math.abs(msft.pct).toFixed(1)}% at ${fmtPrice('MSFT', msft.price)}${m.open ? '' : (m.next ? ` · opens ${m.next}` : '')}.` };
  }

  function weatherReport() {
    if (!wx) return { text: ['Checking the skies…'] };
    const c = wx.current, [, desc] = W(c.weather_code);
    const t = [`${Math.round(c.temperature_2m)}° and ${desc} in `, el('button', { className: 'linkish', textContent: loc.name, onclick: openSheet }), '. '];
    // rain watch over next 12h
    const now = Date.now();
    let firstWet = null, dryAfter = null, n = 0;
    wx.hourly.time.forEach((tm, i) => {
      const ts = new Date(tm).getTime();
      if (ts < now - 3600e3 || n >= 12) return; n++;
      if (wet(wx.hourly.weather_code[i]) && !firstWet) firstWet = tm;
    });
    let rain;
    if (wet(c.weather_code)) rain = 'Bring a coat — it’s wet out now.';
    else if (firstWet) rain = `Rain likely from ${firstWet.slice(11, 16)}.`;
    else rain = 'Dry for the next 12 hours.';
    t.push(rain);
    const d = wx.daily;
    if (d && d.time[1]) t.push(el('span', { className: 'q', textContent: ` Tomorrow ${Math.round(d.temperature_2m_max[1])}°/${Math.round(d.temperature_2m_min[1])}°, ${W(d.weather_code[1])[1]}.` }));
    return { text: t, short: `${Math.round(c.temperature_2m)}° and ${desc} in ${loc.name}. ${rain}` };
  }

  function newsReport(id) {
    const items = feed(TEAM[id].feed);
    if (!items.length) return { text: ['Out on patrol — first report coming shortly.'], fresh: 0 };
    const fresh = items.filter(isFresh).length;
    const lead = items[0];
    const t = [];
    if (fresh) t.push(el('b', { textContent: `${fresh} new since you last looked. ` }));
    else if (lastVisit) t.push('Nothing new since you last looked. ');
    t.push('Lead story: ', el('b', { textContent: `“${lead.title}”` }), el('span', { className: 'q', textContent: ` — ${lead.source}${lead.date ? ', ' + ago(lead.date) : ''}` }));
    return { text: t, fresh, lead };
  }

  // ---------- Rendering ----------
  const cards = {};
  function agentCard(id, extraClass = '') {
    const a = TEAM[id];
    const status = el('div', { className: 'a-status' });
    const badge = el('span', { className: 'badge', style: { display: 'none' } });
    const report = el('p', { className: 'report' });
    const body = el('div');
    const card = el('article', { className: 'agent ' + extraClass, id: 'agent-' + id, style: { '--c': a.c } }, [
      el('div', { className: 'a-head' }, [avatar(id, 'on'), el('div', { className: 'a-who' }, [
        el('div', { className: 'a-name' }, [a.name, el('span', { textContent: a.role })]), status]), badge]),
      report, body
    ]);
    cards[id] = { card, status, badge, report, body, dot: card.querySelector('.st') };
    return card;
  }
  function setStatus(id, text, dot) {
    const c = cards[id]; c.status.textContent = text;
    c.dot.className = 'st ' + (dot || '');
  }

  function itemList(items, max) {
    return el('ul', { className: 'items' }, items.slice(0, max).map(it => {
      const safe = /^https?:\/\//.test(it.link) ? it.link : '#';
      return el('li', { className: isFresh(it) ? 'fresh' : '' }, [el('a', { href: safe, target: '_blank', rel: 'noopener noreferrer' }, [
        el('div', { className: 'h', textContent: it.title }),
        el('div', { className: 'm' }, [el('b', { textContent: it.source }), it.date ? ' · ' + ago(it.date) : ''])
      ])]);
    }));
  }

  function build() {
    const grid = $('grid');
    grid.append(agentCard('atlas', 'chief full'));
    grid.append(agentCard('mara', 'span2'));
    grid.append(agentCard('skye'));
    ['rex', 'nova', 'penny', 'tess', 'pip'].forEach(id => grid.append(agentCard(id)));

    // Markets: quotes + live MSFT mini chart
    const quotes = el('div', { className: 'quotes', id: 'quotes' });
    const chart = el('div', { className: 'chart' });
    chart.append($('chartTpl').content.cloneNode(true));
    const s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
    s.async = true;
    s.textContent = JSON.stringify({ symbol: 'NASDAQ:MSFT', width: '100%', height: '100%', locale: 'en', dateRange: '1D',
      colorTheme: 'dark', isTransparent: true, autosize: true, trendLineColor: 'rgba(52, 211, 153, 1)',
      underLineColor: 'rgba(52, 211, 153, 0.25)', underLineBottomColor: 'rgba(52, 211, 153, 0)', largeChartUrl: '' });
    chart.querySelector('.tradingview-widget-container').append(s);
    cards.mara.body.append(quotes, chart);

    // Roster
    $('roster').replaceChildren(...ORDER.map(id => {
      const b = el('button', { className: 'member', type: 'button', 'aria-label': `${TEAM[id].name}, ${TEAM[id].role}`,
        onclick: () => $('agent-' + id).scrollIntoView({ behavior: 'smooth', block: 'start' }) },
        [avatar(id, 'on'), TEAM[id].name]);
      b.dataset.id = id;
      return b;
    }));
  }

  function renderRoster(statuses) {
    document.querySelectorAll('.member').forEach(b => {
      const id = b.dataset.id, s = statuses[id] || {};
      b.querySelector('.st').className = 'st ' + (s.dot || '');
      const av = b.querySelector('.av');
      if (s.fresh) { b.classList.add('new'); av.dataset.n = s.fresh > 9 ? '9+' : s.fresh; } else b.classList.remove('new');
    });
  }

  let briefTyped = false, typing = false, typeTarget = '';
  function render() {
    const statuses = {};
    const sweepAge = data.updated ? (Date.now() - new Date(data.updated)) / 60e3 : null;
    const newsDot = sweepAge == null ? '' : sweepAge < 75 ? 'on' : 'warn';

    // Header sweep line
    $('sweep').replaceChildren(
      el('div', {}, [el('b', { textContent: '8 agents' }), ' on duty']),
      el('div', { textContent: data.updated ? `Last sweep ${ago(data.updated)}` : 'Waiting for first sweep' }));

    // Mara
    const mr = marketReport(), m = market();
    cards.mara.report.replaceChildren(...mr.text);
    setStatus('mara', m.open ? 'LIVE · watching the open market' : m.pre ? 'Pre-market · standing by' : m.post ? 'After hours · standing by' : `Standing by · market opens ${m.next}`, m.open ? 'live' : '');
    statuses.mara = { dot: m.open ? 'live' : '' };
    const q = data.quotes || {};
    $('quotes').replaceChildren(...['MSFT', 'SPX', 'NDX', 'FTSE', 'GBPUSD'].filter(k => q[k] && q[k].price != null).map(k =>
      el('div', { className: 'quote' }, [
        el('div', { className: 'n', textContent: q[k].name.toUpperCase() }),
        el('div', { className: 'p', textContent: fmtPrice(k, q[k].price) }),
        el('div', { className: 'd ' + dirCls(q[k].pct), textContent: q[k].pct != null ? pctTxt(q[k].pct) : '—' })
      ])));

    // Skye
    const wr = weatherReport();
    cards.skye.report.replaceChildren(...wr.text);
    setStatus('skye', wx ? `On watch · ${loc.name} · checked ${ago(wx.fetched)}` : 'Checking…', wx ? 'on' : '');
    statuses.skye = { dot: wx ? 'on' : '' };
    if (wx) {
      const hours = el('div', { className: 'wx-hours' });
      let n = 0;
      wx.hourly.time.forEach((tm, i) => {
        if (n >= 12 || new Date(tm).getTime() < Date.now() - 3600e3) return; n++;
        hours.append(el('div', { className: 'wx-hour' }, [
          el('div', { textContent: n === 1 ? 'Now' : tm.slice(11, 13) }),
          el('div', { textContent: W(wx.hourly.weather_code[i])[0] }),
          el('div', { textContent: Math.round(wx.hourly.temperature_2m[i]) + '°' })]));
      });
      const days = wx.daily.time.map((day, i) => el('div', { className: 'wx-day' }, [
        el('span', { textContent: `${W(wx.daily.weather_code[i])[0]}  ${i === 0 ? 'Today' : new Date(day + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long' })}` }),
        el('span', { textContent: `${Math.round(wx.daily.temperature_2m_max[i])}° / ${Math.round(wx.daily.temperature_2m_min[i])}°` })]));
      cards.skye.body.replaceChildren(hours, ...days);
    }

    // News agents
    const news = {};
    ['rex', 'nova', 'penny', 'tess', 'pip'].forEach(id => {
      const r = news[id] = newsReport(id), items = feed(TEAM[id].feed), c = cards[id];
      c.report.replaceChildren(...r.text);
      setStatus(id, items.length ? `On watch · ${items.length} stories filed · ${ago(data.updated)}` : 'Heading out…', items.length ? newsDot : '');
      statuses[id] = { dot: items.length ? newsDot : '', fresh: r.fresh };
      if (r.fresh) { c.badge.style.display = ''; c.badge.textContent = `${r.fresh} new`; } else c.badge.style.display = 'none';
      if (items.length > 1) {
        const expanded = c.body.dataset.open === '1';
        const list = itemList(items.slice(1), expanded ? 19 : 3);
        const btn = el('button', { className: 'more', type: 'button', textContent: expanded ? 'Show less ▴' : `Full report · ${items.length - 4} more ▾`,
          onclick: () => { c.body.dataset.open = expanded ? '0' : '1'; render(); } });
        c.body.replaceChildren(list, items.length > 4 ? btn : '');
      }
    });

    // Atlas — the briefing
    const h = new Date().getHours();
    const greet = h < 5 ? 'Evening' : h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
    const totalFresh = Object.values(news).reduce((s, r) => s + (r.fresh || 0), 0);
    const atlasText = `${greet}. ` + (totalFresh ? `The team has ${totalFresh} new item${totalFresh === 1 ? '' : 's'} since you last checked in. Here’s what matters:` : 'Here’s where things stand:');
    typeTarget = atlasText;
    if (!typing) cards.atlas.report.textContent = briefTyped ? atlasText : '';
    setStatus('atlas', `Briefing ready · ${hhmm(new Date())}`, 'on');
    statuses.atlas = { dot: 'on' };
    const lines = [];
    if (mr.short) lines.push(['mara', mr.short]);
    if (wr.short) lines.push(['skye', wr.short]);
    if (news.rex.lead) lines.push(['rex', `Microsoft: ${news.rex.lead.title}`]);
    if (news.nova.lead) lines.push(['nova', `Top story: ${news.nova.lead.title}`]);
    if (news.pip.lead) lines.push(['pip', `iPhone: ${news.pip.lead.title}`]);
    const ul = el('ul', { className: 'brief' }, lines.map(([id, txt], i) =>
      el('li', { style: { animationDelay: briefTyped ? '0s' : (0.25 + i * 0.18) + 's' } }, [avatar(id), el('span', { textContent: txt })])));
    cards.atlas.body.replaceChildren(ul);
    if (!briefTyped && data.updated) {
      briefTyped = typing = true;
      const r = cards.atlas.report; let i = 0; r.classList.add('typing');
      const ti = setInterval(() => {
        r.textContent = typeTarget.slice(0, ++i);
        if (i >= typeTarget.length) { clearInterval(ti); typing = false; r.classList.remove('typing'); }
      }, 14);
    }

    renderRoster(statuses);
  }

  // ---------- Loading ----------
  async function loadData() {
    try {
      const r = await fetch('data/feeds.json?t=' + Date.now(), { cache: 'no-store' });
      data = await r.json();
    } catch {}
    render();
  }
  async function loadWeather() {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
        `&current=temperature_2m,weather_code,apparent_temperature,wind_speed_10m` +
        `&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4`;
      const r = await fetch(url); if (!r.ok) throw 0;
      wx = await r.json(); wx.fetched = new Date().toISOString();
    } catch {}
    render();
  }

  // Clock
  function tick() {
    const now = new Date();
    $('clock').textContent = hhmm(now);
    $('date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // Weather location sheet
  function openSheet() { $('sheet').classList.add('open'); $('sheetBg').classList.add('open'); }
  function closeSheet() { $('sheet').classList.remove('open'); $('sheetBg').classList.remove('open'); }
  $('sheetBg').onclick = closeSheet;
  function setLoc(l) { loc = l; store.set('loc', l); wx = null; loadWeather(); setTimeout(closeSheet, 500); }
  $('cityForm').onsubmit = async e => {
    e.preventDefault();
    const q = $('cityInput').value.trim(); if (!q) return;
    $('cityMsg').textContent = 'Searching…';
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=${encodeURIComponent(q)}`);
      const g = ((await r.json()).results || [])[0];
      if (!g) { $('cityMsg').textContent = 'Couldn’t find that place.'; return; }
      $('cityMsg').textContent = `Skye’s heading to ${g.name}${g.country ? ', ' + g.country : ''}.`;
      $('cityInput').value = '';
      setLoc({ lat: +g.latitude.toFixed(2), lon: +g.longitude.toFixed(2), name: g.name });
    } catch { $('cityMsg').textContent = 'Search failed — try again.'; }
  };
  $('geoBtn').onclick = () => {
    if (!navigator.geolocation) return;
    $('cityMsg').textContent = 'Finding you…';
    navigator.geolocation.getCurrentPosition(
      p => setLoc({ lat: +p.coords.latitude.toFixed(2), lon: +p.coords.longitude.toFixed(2), name: 'your area' }),
      () => { $('cityMsg').textContent = 'Permission declined — type a town instead.'; },
      { timeout: 10000, maximumAge: 600000 });
  };

  build(); tick(); render();
  setInterval(tick, 1000);
  loadData(); loadWeather();
  setInterval(loadData, 5 * 60e3);
  setInterval(loadWeather, 15 * 60e3);
  setInterval(render, 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadData(); loadWeather(); } });
})();
</script>
</body>
</html>

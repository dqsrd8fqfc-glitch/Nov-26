<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#0b1120">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dashboard</title>
<style>
  :root {
    --bg: #0b1120; --bg2: #0f172a;
    --card: rgba(255,255,255,0.055); --card-border: rgba(255,255,255,0.08);
    --text: #f1f5f9; --muted: #94a3b8; --faint: #64748b;
    --accent: #38bdf8; --up: #34d399; --down: #f87171;
    --radius: 22px; --gap: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(56,189,248,0.16), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(167,139,250,0.14), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1400px; margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      calc(env(safe-area-inset-right) + 14px)
      calc(env(safe-area-inset-bottom) + 24px)
      calc(env(safe-area-inset-left) + 14px);
  }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  .greeting { font-size: 15px; color: var(--muted); margin: 0 0 2px; font-weight: 500; }
  .clock { font-size: clamp(52px, 15vw, 88px); font-weight: 200; letter-spacing: -0.04em; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
  .date { font-size: 16px; color: var(--muted); margin-top: 6px; }
  .wx-mini { text-align: right; cursor: pointer; background: none; border: none; color: inherit; font: inherit; padding: 0; }
  .wx-mini .t { font-size: 34px; font-weight: 300; letter-spacing: -0.02em; }
  .wx-mini .p { font-size: 13px; color: var(--muted); }

  /* Ticker tape */
  .tape { border-radius: 16px; overflow: hidden; margin-bottom: var(--gap); background: var(--card); border: 1px solid var(--card-border); min-height: 46px; }

  /* Grid */
  .grid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } .wide { grid-column: span 2; } }
  @media (min-width: 1050px) { .grid { grid-template-columns: repeat(3, 1fr); } .span2 { grid-column: span 2; } .wide { grid-column: span 3; } }

  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 16px; min-width: 0;
    backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
    animation: rise .5s ease both;
  }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card h2 {
    margin: 0 0 12px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .card h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); text-align: right; }
  .empty { color: var(--muted); font-size: 15px; margin: 6px 0; }

  /* MSFT */
  .msft { height: 380px; margin: 0 -6px -6px; }
  @media (min-width: 700px) { .msft { height: 420px; } }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
  .live-dot.on { background: var(--up); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 70% { box-shadow: 0 0 0 7px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }

  /* Weather */
  .wx-now { display: flex; align-items: center; gap: 14px; }
  .wx-icon { font-size: 52px; line-height: 1; }
  .wx-temp { font-size: 46px; font-weight: 300; letter-spacing: -0.03em; }
  .wx-desc { color: var(--muted); font-size: 14px; }
  .wx-hours { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; padding-bottom: 2px; scrollbar-width: none; }
  .wx-hours::-webkit-scrollbar { display: none; }
  .wx-hour { flex: 0 0 auto; text-align: center; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,0.05); min-width: 54px; font-size: 13px; }
  .wx-hour div:nth-child(2) { font-size: 20px; margin: 2px 0; }
  .wx-days { margin-top: 12px; }
  .wx-day { display: flex; justify-content: space-between; padding: 7px 2px; border-top: 1px solid var(--card-border); font-size: 15px; }
  .wx-day span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* News */
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 10px; padding: 0 16px 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; border: 1px solid var(--card-border); background: rgba(255,255,255,0.04); color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .news { list-style: none; margin: 0; padding: 0; }
  @media (min-width: 1050px) { .news { columns: 2; column-gap: 28px; } .news li { break-inside: avoid; } }
  .news li { border-bottom: 1px solid var(--card-border); }
  .news li:last-child { border-bottom: none; }
  .news a { display: block; padding: 12px 2px; color: var(--text); text-decoration: none; }
  .news a:active { opacity: .6; }
  .news .h { font-size: 16px; line-height: 1.35; font-weight: 500; }
  .news .m { font-size: 12.5px; color: var(--faint); margin-top: 4px; }
  .news .m b { color: var(--accent); font-weight: 600; }

  /* Location sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto;
    background: #131c31; border: 1px solid var(--card-border); border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: none; } .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--faint); margin: 4px auto 16px; }
  .sheet h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  input[type=text] {
    font: inherit; font-size: 16px; color: var(--text); background: rgba(255,255,255,.07);
    border: 1px solid var(--card-border); border-radius: 12px; padding: 11px 12px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .btn { border: none; border-radius: 12px; padding: 11px 16px; font-size: 15px; font-weight: 600; background: var(--accent); color: #04121c; cursor: pointer; }
  .btn.ghost { background: rgba(255,255,255,.08); color: var(--text); width: 100%; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 18px; line-height: 1.5; }
  footer a { color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="greeting" id="greeting">Hello</p>
      <h1 class="clock" id="clock">--:--</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="wx-mini" id="wxMini" aria-label="Change weather location">
      <div class="t" id="wxMiniT">–</div>
      <div class="p" id="wxMiniP">Weather</div>
    </button>
  </header>

  <!-- Live market ticker tape (TradingView) -->
  <div class="tape">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName": "NASDAQ:MSFT", "title": "Microsoft"},
          {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
          {"proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100"},
          {"proName": "FOREXCOM:UKXGBP", "title": "FTSE 100"},
          {"proName": "NASDAQ:AAPL", "title": "Apple"},
          {"proName": "NASDAQ:NVDA", "title": "Nvidia"},
          {"proName": "FX_IDC:GBPUSD", "title": "GBP/USD"},
          {"proName": "BITSTAMP:BTCUSD", "title": "Bitcoin"}
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <main class="grid">
    <section class="card span2">
      <h2><span><span class="live-dot" id="mktDot"></span>Microsoft · MSFT</span><small id="mktStatus"></small></h2>
      <div class="msft">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
          <script src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
          {
            "symbols": [["Microsoft", "NASDAQ:MSFT|1D"]],
            "chartOnly": false,
            "width": "100%",
            "height": "100%",
            "autosize": true,
            "locale": "en",
            "colorTheme": "dark",
            "isTransparent": true,
            "showVolume": false,
            "showMA": false,
            "hideDateRanges": false,
            "hideMarketStatus": false,
            "hideSymbolLogo": false,
            "scalePosition": "right",
            "scaleMode": "Normal",
            "fontFamily": "-apple-system, BlinkMacSystemFont, sans-serif",
            "fontSize": "10",
            "noTimeScale": false,
            "valuesTracking": "1",
            "changeMode": "price-and-percent",
            "chartType": "area",
            "lineWidth": 2,
            "lineType": 0,
            "lineColor": "rgba(56, 189, 248, 1)",
            "topColor": "rgba(56, 189, 248, 0.35)",
            "bottomColor": "rgba(56, 189, 248, 0)",
            "dateRanges": ["1d|1", "5d|5", "1m|30", "12m|1D", "60m|1W", "all|1M"]
          }
          </script>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Weather <small id="wxPlace"></small></h2>
      <div id="wxBody"><p class="empty">Loading…</p></div>
    </section>

    <section class="card wide">
      <h2>Headlines <small id="newsUpdated"></small></h2>
      <div class="tabs" id="tabs"></div>
      <ul class="news" id="news"><li><p class="empty">Loading…</p></li></ul>
    </section>
  </main>

  <footer>
    Market data by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> ·
    Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
    Headlines from BBC, Google News, The Verge &amp; 9to5Mac
  </footer>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Weather location">
  <div class="grabber"></div>
  <h3>Weather location</h3>
  <form class="row" id="cityForm" autocomplete="off">
    <input type="text" id="cityInput" placeholder="Town or city" maxlength="60" enterkeyhint="search">
    <button class="btn" type="submit">Set</button>
  </form>
  <button class="btn ghost" id="geoBtn" type="button">📍 Use my current location</button>
  <p class="hint" id="cityMsg">Saved only in this browser.</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => { const n = document.createElement(tag); Object.assign(n, props); kids.forEach(k => n.append(k)); return n; };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('dash.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('dash.' + k, JSON.stringify(v)); } catch {} }
  };

  // ---------- Clock ----------
  function tick() {
    const now = new Date();
    $('clock').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    $('date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    const h = now.getHours();
    $('greeting').textContent = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    if (now.getSeconds() === 0 || !$('mktStatus').textContent) marketStatus(now);
  }

  // ---------- US market status (NASDAQ 9:30–16:00 New York; holidays not included) ----------
  const nyParts = t => {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' })
      .formatToParts(t).map(x => [x.type, x.value]));
    return { day: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday), mins: +p.hour * 60 + +p.minute };
  };
  function marketStatus(now) {
    const { day, mins } = nyParts(now);
    const wk = day >= 1 && day <= 5;
    const open = wk && mins >= 570 && mins < 960;
    $('mktDot').classList.toggle('on', open);
    let label = open ? 'Market open · live'
      : wk && mins >= 240 && mins < 570 ? 'Pre-market'
      : wk && mins >= 960 && mins < 1200 ? 'After hours' : 'Market closed';
    if (!open) {
      // find next weekday 09:30 New York, shown in local time
      const start = Math.ceil(now.getTime() / 60e3) * 60e3;
      for (let m = 0; m < 8 * 1440; m += 1) {
        const t = new Date(start + m * 60e3), p = nyParts(t);
        if (p.day >= 1 && p.day <= 5 && p.mins === 570) {
          const sameDay = t.toDateString() === now.toDateString();
          const time = t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
          label += ' · opens ' + (sameDay ? time : t.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + time);
          break;
        }
        // jump ahead faster when far from 09:30
        if (Math.abs(p.mins - 570) > 30) m += 29;
      }
    }
    $('mktStatus').textContent = label;
  }
  tick(); setInterval(tick, 1000);

  // ---------- Weather (Open-Meteo, no key) ----------
  const WX = {0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Fog'],
    51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Drizzle'],56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],
    61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],
    71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Showers'],
    82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['🌨️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
  const wx = c => WX[c] || ['🌡️', '—'];
  let loc = store.get('loc', { lat: 51.51, lon: -0.13, name: 'London' });

  async function loadWeather() {
    $('wxPlace').textContent = loc.name;
    $('wxMiniP').textContent = loc.name;
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
        `&current=temperature_2m,weather_code,apparent_temperature,wind_speed_10m` +
        `&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min` +
        `&timezone=auto&forecast_days=4&wind_speed_unit=mph`;
      const r = await fetch(url); if (!r.ok) throw 0;
      const d = await r.json();
      const [ico, desc] = wx(d.current.weather_code);
      const t = Math.round(d.current.temperature_2m);
      $('wxMiniT').textContent = `${ico} ${t}°`;
      const now = el('div', { className: 'wx-now' }, [
        el('div', { className: 'wx-icon', textContent: ico }),
        el('div', {}, [
          el('div', { className: 'wx-temp', textContent: t + '°' }),
          el('div', { className: 'wx-desc', textContent: `${desc} · feels ${Math.round(d.current.apparent_temperature)}° · ${Math.round(d.current.wind_speed_10m)} mph` })
        ])
      ]);
      const hours = el('div', { className: 'wx-hours' });
      const from = Date.now() - 3600e3; let n = 0;
      d.hourly.time.forEach((tm, i) => {
        if (n >= 12 || new Date(tm).getTime() < from) return; n++;
        hours.append(el('div', { className: 'wx-hour' }, [
          el('div', { textContent: n === 1 ? 'Now' : tm.slice(11, 13) }),
          el('div', { textContent: wx(d.hourly.weather_code[i])[0] }),
          el('div', { textContent: Math.round(d.hourly.temperature_2m[i]) + '°' })
        ]));
      });
      const days = el('div', { className: 'wx-days' });
      d.daily.time.forEach((day, i) => {
        const name = i === 0 ? 'Today' : new Date(day + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long' });
        days.append(el('div', { className: 'wx-day' }, [
          el('span', { textContent: `${wx(d.daily.weather_code[i])[0]}  ${name}` }),
          el('span', { textContent: `${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°` })
        ]));
      });
      $('wxBody').replaceChildren(now, hours, days);
    } catch {
      $('wxBody').replaceChildren(el('p', { className: 'empty', textContent: 'Couldn’t load the weather right now.' }));
    }
  }
  loadWeather(); setInterval(loadWeather, 15 * 60e3);

  // Location sheet
  const openSheet = () => { $('sheet').classList.add('open'); $('sheetBg').classList.add('open'); };
  const closeSheet = () => { $('sheet').classList.remove('open'); $('sheetBg').classList.remove('open'); };
  $('wxMini').onclick = openSheet; $('wxPlace').onclick = openSheet; $('sheetBg').onclick = closeSheet;
  function setLoc(l) { loc = l; store.set('loc', l); loadWeather(); setTimeout(closeSheet, 500); }
  $('cityForm').onsubmit = async e => {
    e.preventDefault();
    const q = $('cityInput').value.trim(); if (!q) return;
    $('cityMsg').textContent = 'Searching…';
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=${encodeURIComponent(q)}`);
      const g = ((await r.json()).results || [])[0];
      if (!g) { $('cityMsg').textContent = 'Couldn’t find that place.'; return; }
      $('cityMsg').textContent = `Set to ${g.name}${g.country ? ', ' + g.country : ''}.`;
      $('cityInput').value = '';
      setLoc({ lat: +g.latitude.toFixed(2), lon: +g.longitude.toFixed(2), name: g.name });
    } catch { $('cityMsg').textContent = 'Search failed — try again.'; }
  };
  $('geoBtn').onclick = () => {
    if (!navigator.geolocation) return;
    $('cityMsg').textContent = 'Finding you…';
    navigator.geolocation.getCurrentPosition(
      p => { $('cityMsg').textContent = 'Location set.'; setLoc({ lat: +p.coords.latitude.toFixed(2), lon: +p.coords.longitude.toFixed(2), name: 'Here' }); },
      () => { $('cityMsg').textContent = 'Permission declined — type a town instead.'; },
      { timeout: 10000, maximumAge: 600000 });
  };

  // ---------- Headlines (data/feeds.json, refreshed by GitHub Actions) ----------
  let feeds = [], active = store.get('tab', 'top'), updated = null;
  function ago(iso) {
    if (!iso) return '';
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function renderTabs() {
    $('tabs').replaceChildren(...feeds.map(f => el('button', {
      className: 'tab' + (f.id === active ? ' active' : ''), textContent: f.title, type: 'button',
      onclick: () => { active = f.id; store.set('tab', active); renderTabs(); renderNews(); }
    })));
  }
  function renderNews() {
    $('newsUpdated').textContent = updated ? 'Updated ' + ago(updated) : '';
    const f = feeds.find(x => x.id === active) || feeds[0];
    if (!f || !f.items.length) {
      $('news').replaceChildren(el('li', {}, [el('p', { className: 'empty', textContent: 'Headlines are on their way — the first update runs shortly.' })]));
      return;
    }
    $('news').replaceChildren(...f.items.map(it => {
      const safe = /^https?:\/\//.test(it.link) ? it.link : '#';
      const meta = el('div', { className: 'm' }, [el('b', { textContent: it.source }), document.createTextNode(it.date ? ' · ' + ago(it.date) : '')]);
      return el('li', {}, [el('a', { href: safe, target: '_blank', rel: 'noopener noreferrer' }, [el('div', { className: 'h', textContent: it.title }), meta])]);
    }));
  }
  async function loadNews() {
    try {
      const r = await fetch('data/feeds.json?t=' + Date.now(), { cache: 'no-store' });
      const d = await r.json();
      feeds = d.feeds || []; updated = d.updated;
      if (feeds.length && !feeds.some(f => f.id === active)) active = feeds[0].id;
      renderTabs(); renderNews();
    } catch {
      $('news').replaceChildren(el('li', {}, [el('p', { className: 'empty', textContent: 'Couldn’t load headlines right now.' })]));
    }
  }
  loadNews(); setInterval(loadNews, 5 * 60e3); setInterval(renderNews, 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadNews(); loadWeather(); } });
})();
</script>
</body>
</html>

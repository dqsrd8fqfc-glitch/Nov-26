name: Update news feeds

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_feeds.py"
      - ".github/workflows/feeds.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: |
          mkdir -p data
          python scripts/fetch_feeds.py data/feeds.json

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "feeds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update feeds"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
